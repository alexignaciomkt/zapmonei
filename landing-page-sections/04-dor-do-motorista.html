<style>
  /* Reset local e fontes */
  .pain-points-section {
    font-family: 'Outfit', 'Inter', sans-serif;
    color: #FFFFFF;
    padding: 100px 10px;
    background-color: #000316; /* Fundo Exato do Site */
    position: relative;
    overflow: hidden;
  }

  .pain-container {
    max-width: 1140px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  /* Cabeçalho */
  .pain-header {
    text-align: center;
    margin-bottom: 70px;
  }

  .pain-title {
    font-size: 46px;
    font-weight: 800;
    line-height: 1.15;
    margin: 0;
    color: #FFFFFF;
    letter-spacing: -0.03em;
    text-align: center;
  }

  /* Flexbox Container - O Segredo da Simetria Perfeita */
  .pain-flex-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    max-width: 900px;
    margin: 0 auto;
  }

  /* Cards - FIEL AO MOCKUP EM TAMANHO E COR */
  .pain-card {
    width: 240px;      /* Largura idêntica ao mockup */
    height: 320px;     /* Altura idêntica ao mockup */
    background: linear-gradient(180deg, #181b22 0%, #0d0f12 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-sizing: border-box;
    position: relative;
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  /* Borda no topo ligeiramente mais brilhante (efeito mockup) */
  .pain-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 24px;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* Hover dos cards com acendimento neon verde-limão */
  .pain-card:hover {
    transform: translateY(-8px);
    border-color: #A6FF00; /* Acende a borda no tom limão exato */
    box-shadow: 0 25px 50px -15px rgba(166, 255, 0, 0.45); /* Brilho neon do mockup */
  }

  /* Gráficos Gigantes */
  .pain-graphic-wrapper {
    height: 140px;
    width: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 25px;
  }

  .pain-svg-icon {
    width: 120px;
    height: 120px;
    /* Efeito de Lâmpada de Neon Acesa e Volumosa */
    filter: drop-shadow(0 0 15px rgba(166, 255, 0, 0.7));
    transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  /* Ao passar o mouse, o ícone cresce ligeiramente e brilha mais */
  .pain-card:hover .pain-svg-icon {
    transform: scale(1.06);
    filter: drop-shadow(0 0 22px rgba(166, 255, 0, 0.9));
  }

  /* Título do Card - Negrito Médio com quebra de linha idêntico ao mockup */
  .pain-card-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
    color: #FFFFFF;
    margin: 0;
    letter-spacing: -0.02em;
  }

  /* 🌌 MESH GRIDS 3D NO BACKGROUND (Exatamente como o Mockup) */
  .mesh-grid {
    position: absolute;
    width: 380px;
    height: 380px;
    background-image: 
      linear-gradient(rgba(166, 255, 0, 0.08) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(166, 255, 0, 0.08) 1.5px, transparent 1.5px);
    background-size: 30px 30px;
    opacity: 0.45;
    pointer-events: none;
  }

  .mesh-top-right {
    top: -50px;
    right: -100px;
    transform: perspective(600px) rotateX(55deg) rotateY(-15deg) rotateZ(10deg);
    mask-image: radial-gradient(circle at center, black, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at center, black, transparent 70%);
  }

  .mesh-bottom-left {
    bottom: -100px;
    left: -100px;
    transform: perspective(600px) rotateX(55deg) rotateY(15deg) rotateZ(-10deg);
    mask-image: radial-gradient(circle at center, black, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at center, black, transparent 70%);
  }

  /* Responsividade */
  @media (max-width: 767px) {
    .pain-title {
      font-size: 28px;
    }
    .pain-flex-container {
      gap: 20px;
    }
    .pain-card {
      width: 100%;
      max-width: 280px;
      height: 300px;
    }
  }
</style>
