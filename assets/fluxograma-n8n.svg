<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fcfcfd; }
      .title { font: bold 28px sans-serif; fill: #1e293b; }
      .subtitle { font: 14px sans-serif; fill: #64748b; }
      
      /* Tipos de Caixas */
      .box-input { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 12; }
      .box-logic { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .box-db { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 12; }
      .box-ai { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 12; }
      .box-media { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 12; }
      
      .text-head { font: bold 16px sans-serif; fill: #1e293b; }
      .text-body { font: 12px sans-serif; fill: #475569; }
      
      .arrow { stroke: #cbd5e1; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dash { stroke: #22c55e; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowhead-green); }
      
      .label-yes { font: bold 12px sans-serif; fill: #16a34a; }
      .label-no { font: bold 12px sans-serif; fill: #ef4444; }
      .diamond { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cbd5e1" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="800" />

  <text x="600" y="60" text-anchor="middle" class="title">Fluxo Inteligente n8n — Automação Financeira</text>
  <text x="600" y="85" text-anchor="middle" class="subtitle">Processamento de mensagens WhatsApp com OCR, NLP e Gravação em Banco de Dados</text>

  <!-- PRIMEIRA LINHA -->
  <!-- 1. Webhook -->
  <g transform="translate(100, 150)">
    <rect class="box-input" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">1. Webhook</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Recebe JSON</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">do WhatsApp</text>
  </g>

  <!-- 2. Normalize -->
  <g transform="translate(320, 150)">
    <rect class="box-logic" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">2. Normalize</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Limpa payload e</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">mapeia campos</text>
  </g>

  <!-- 3. Deduplicação -->
  <g transform="translate(540, 150)">
    <rect class="box-logic" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">3. Deduplicação</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Evita registros</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">duplicados</text>
  </g>

  <!-- 4. Save Message -->
  <g transform="translate(760, 150)">
    <rect class="box-db" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">4. Save Message</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Grava rastro inicial</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">no Postgres</text>
  </g>

  <!-- 5. Decisão Mídia -->
  <g transform="translate(970, 150)">
    <polygon class="diamond" points="90,0 180,40 90,80 0,40" />
    <text x="90" y="45" text-anchor="middle" class="text-head" style="font-size:12px">Há mídia?</text>
  </g>

  <!-- Setas Linha 1 -->
  <path class="arrow" d="M 280 190 L 320 190" />
  <path class="arrow" d="M 500 190 L 540 190" />
  <path class="arrow" d="M 720 190 L 760 190" />
  <path class="arrow" d="M 940 190 L 970 190" />

  <!-- SEGUNDA LINHA (FLUXO DE IMAGEM) -->
  <!-- 6. Upload S3 -->
  <g transform="translate(970, 300)">
    <rect class="box-media" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">6. Upload S3</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Salva foto e</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">gera URL</text>
  </g>

  <!-- 7. OCR -->
  <g transform="translate(970, 420)">
    <rect class="box-ai" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">7. OCR</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Transforma nota</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">em texto brutos</text>
  </g>

  <!-- Conexões de Decisão -->
  <path class="arrow-dash" d="M 1060 230 L 1060 300" />
  <text x="1070" y="265" class="label-yes">Sim</text>

  <path class="arrow" d="M 1060 380 L 1060 420" />

  <!-- TERCEIRA LINHA (VOLTANDO) -->
  <!-- 8. NLP / NER -->
  <g transform="translate(760, 420)">
    <rect class="box-ai" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">8. NLP / NER</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Extrai Valor e</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">Categoria</text>
  </g>

  <!-- 9. Transaction Draft -->
  <g transform="translate(540, 420)">
    <rect class="box-db" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">9. Draft Tx</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Cria lançamento</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">pendente</text>
  </g>

  <!-- 10. Send Confirmation -->
  <g transform="translate(320, 420)">
    <rect class="box-input" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">10. Confirm?</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Pergunta ao</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">motorista</text>
  </g>

  <!-- 11. Wait Reply -->
  <g transform="translate(100, 420)">
    <rect class="box-logic" width="180" height="80" />
    <text x="90" y="35" text-anchor="middle" class="text-head">11. Aguarda</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Sim ou Edição</text>
  </g>

  <!-- 12. Finaliza -->
  <g transform="translate(100, 580)">
    <rect class="box-db" width="180" height="80" style="stroke: #16a34a; fill: #f0fdf4;" />
    <text x="90" y="35" text-anchor="middle" class="text-head">12. Sucesso</text>
    <text x="90" y="55" text-anchor="middle" class="text-body">Update status</text>
    <text x="90" y="70" text-anchor="middle" class="text-body">Confirmado!</text>
  </g>

  <!-- Setas de Retorno e Finalização -->
  <path class="arrow" d="M 970 460 L 940 460" /> <!-- OCR para NLP -->
  <path class="arrow" d="M 760 460 L 720 460" />
  <path class="arrow" d="M 540 460 L 500 460" />
  <path class="arrow" d="M 320 460 L 280 460" />
  <path class="arrow" d="M 190 500 L 190 580" />

  <!-- Seta para o caso de não haver mídia (Pula direto para NLP) -->
  <path class="arrow" d="M 1150 190 L 1180 190 L 1180 540 L 850 540 L 850 500" />
  <text x="1160" y="180" class="label-no">Não</text>

  <!-- Legenda e Rodapé -->
  <text x="600" y="720" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">
    * Linhas tracejadas verdes representam o caminho exclusivo para fotos de notas fiscais.
  </text>
</svg>