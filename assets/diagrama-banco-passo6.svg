<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <rect width="800" height="600" fill="#FFFFFF"/>
  
  <style>
    .title { font: bold 16px sans-serif; fill: #1A202C; }
    .field { font: 12px sans-serif; fill: #4A5568; }
    .type { font: italic 11px sans-serif; fill: #718096; }
    .box { fill: #F7FAFC; stroke: #CBD5E0; stroke-width: 1.5; rx: 10; }
    .header-box { fill: #EDF2F7; stroke: #CBD5E0; stroke-width: 1.5; rx: 10 10 0 0; }
    .line { stroke: #A0AEC0; stroke-width: 1; fill: none; }
    .arrow { fill: #A0AEC0; }
  </style>

  <!-- Definição de Seta -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#A0AEC0" />
    </marker>
  </defs>

  <!-- TABELA: USUARIO -->
  <g transform="translate(50, 50)">
    <rect class="box" width="200" height="130" />
    <path d="M0 10 Q0 0 10 0 L190 0 Q200 0 200 10 L200 35 L0 35 Z" class="header-box" />
    <text x="15" y="23" class="title">Usuário (User)</text>
    <text x="15" y="55" class="field">id <tspan class="type">[PK] uuid</tspan></text>
    <text x="15" y="75" class="field">telefone <tspan class="type">text (unique)</tspan></text>
    <text x="15" y="95" class="field">nome <tspan class="type">text</tspan></text>
    <text x="15" y="115" class="field">tipo_veiculo <tspan class="type">text</tspan></text>
  </g>

  <!-- TABELA: CATEGORIA -->
  <g transform="translate(50, 420)">
    <rect class="box" width="200" height="110" />
    <path d="M0 10 Q0 0 10 0 L190 0 Q200 0 200 10 L200 35 L0 35 Z" class="header-box" />
    <text x="15" y="23" class="title">Categoria</text>
    <text x="15" y="55" class="field">id <tspan class="type">[PK] uuid</tspan></text>
    <text x="15" y="75" class="field">nome <tspan class="type">text</tspan></text>
    <text x="15" y="95" class="field">padrao_contexto <tspan class="type">text</tspan></text>
  </g>

  <!-- TABELA: LANÇAMENTO -->
  <g transform="translate(350, 180)">
    <rect class="box" width="230" height="190" />
    <path d="M0 10 Q0 0 10 0 L220 0 Q230 0 230 10 L230 35 L0 35 Z" class="header-box" />
    <text x="15" y="23" class="title">Lançamento (Tx)</text>
    <text x="15" y="55" class="field">id <tspan class="type">[PK] uuid</tspan></text>
    <text x="15" y="75" class="field">user_id <tspan class="type">[FK] uuid</tspan></text>
    <text x="15" y="95" class="field">tipo <tspan class="type">enum (ganho/gasto)</tspan></text>
    <text x="15" y="115" class="field">valor <tspan class="type">numeric</tspan></text>
    <text x="15" y="135" class="field">categoria_id <tspan class="type">[FK] uuid</tspan></text>
    <text x="15" y="155" class="field">contexto <tspan class="type">text</tspan></text>
    <text x="15" y="175" class="field">ocorrencia_em <tspan class="type">tstz</tspan></text>
  </g>

  <!-- TABELA: CONVERSA -->
  <g transform="translate(50, 240)">
    <rect class="box" width="200" height="130" />
    <path d="M0 10 Q0 0 10 0 L190 0 Q200 0 200 10 L200 35 L0 35 Z" class="header-box" />
    <text x="15" y="23" class="title">Conversa (Message)</text>
    <text x="15" y="55" class="field">id <tspan class="type">[PK] uuid</tspan></text>
    <text x="15" y="75" class="field">user_id <tspan class="type">[FK] uuid</tspan></text>
    <text x="15" y="95" class="field">conteudo <tspan class="type">text</tspan></text>
    <text x="15" y="115" class="field">process_meta <tspan class="type">jsonb</tspan></text>
  </g>

  <!-- TABELA: ANEXO -->
  <g transform="translate(630, 240)">
    <rect class="box" width="150" height="90" />
    <path d="M0 10 Q0 0 10 0 L140 0 Q150 0 150 10 L150 35 L0 35 Z" class="header-box" />
    <text x="15" y="23" class="title">Anexo</text>
    <text x="15" y="55" class="field">id <tspan class="type">uuid</tspan></text>
    <text x="15" y="75" class="field">tx_id <tspan class="type">[FK] uuid</tspan></text>
  </g>

  <!-- RELACIONAMENTOS (LINHAS) -->
  <!-- Usuario -> Lançamento -->
  <path d="M 250 115 L 300 115 L 300 195 L 350 195" class="line" marker-end="url(#arrowhead)" />
  
  <!-- Usuario -> Conversa -->
  <path d="M 150 180 L 150 240" class="line" marker-end="url(#arrowhead)" />

  <!-- Categoria -> Lançamento -->
  <path d="M 250 475 L 465 475 L 465 370" class="line" marker-end="url(#arrowhead)" />

  <!-- Lançamento -> Anexo -->
  <path d="M 580 285 L 630 285" class="line" marker-end="url(#arrowhead)" />

  <!-- Conversa -> Lançamento (Vínculo de processo) -->
  <path d="M 250 305 L 350 305" style="stroke-dasharray: 4; stroke: #3182CE;" class="line" marker-end="url(#arrowhead)" />
  <text x="270" y="300" style="font-size: 10px; fill: #3182CE;">Vínculo IA</text>

</svg>