name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verificar Secrets do Supabase
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then echo "Erro: URL Vazia"; exit 1; fi
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then echo "Erro: Chave Vazia"; exit 1; fi
          echo "Todos os Secrets foram carregados com sucesso!"

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: ./frontend  # AQUI ESTÁ O SEGREDO: apontamos para a pasta frontend
          push: true
          tags: a2system/zapmonei-frontend:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
