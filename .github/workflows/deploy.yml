name: Deploy to Portainer

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: alexignacio/zapmonei-frontend:latest
          cache-from: type=registry,ref=alexignacio/zapmonei-frontend:buildcache
          cache-to: type=registry,ref=alexignacio/zapmonei-frontend:buildcache,mode=max

      - name: Disparar Webhook do Portainer
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
